[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "vscode-insiders-updater"
version = "0.1.3"
description = "Professional VS Code Insiders updater for Linux"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Nariman Jafari", email = "noreply@example.com" },
]
keywords = ["vscode", "insiders", "updater", "linux", "debian"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Desktop Environment",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "PySide6>=6.7.0",
]

[project.scripts]
vsi-updater = "vsi_updater.main:entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["src/vsi_updater"]
